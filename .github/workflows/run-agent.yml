# Reusable workflow: run one prompt through the routed harness, then publish.
#
# Two jobs with separate authority:
# - agent:   contents: read. Checks out the target (no persisted token), runs
#            the agent with ONLY the route's credential, in the agent step only,
#            and uploads run-result.json, run-log.jsonl and changes.json.
# - publish: contents/pull-requests: write, no model credential. Reads the
#            downloaded artifact (the canonical result directory) and creates
#            or updates the static-branch pull request and the PR comment.
#
# Every step with real logic is an `agent-ci` subcommand (src/commands/).
name: agent-ci run

on:
  workflow_call:
    inputs:
      model:
        description: Qualified model from models.yaml (for example claude-haiku-4-5, grok-4.7, fake-edit).
        type: string
        required: true
      harness:
        description: Pin a harness (claude, codex, opencode, cursor, fake). Empty resolves from the model.
        type: string
        default: ''
      route:
        description: Pick an exact route id from models.yaml. Empty resolves from the model.
        type: string
        default: ''
      prompt:
        description: The configured prompt.
        type: string
        required: true
      mode:
        description: read-only or edit.
        type: string
        default: read-only
      output_contract:
        description: report, changes, issues or verdict.
        type: string
        default: report
      use_case:
        description: Run identity; also names the default static branch (agent-ci/<use_case>).
        type: string
        default: generic-prompt
      target_ref:
        description: >-
          Commit or branch of this repository to run on. Empty means the pull request
          head for pull-request events, else the triggering commit. Resolved once to a
          commit SHA that every job checks out.
        type: string
        default: ''
      runs_on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
      job_timeout_minutes:
        description: Timeout for each job.
        type: number
        default: 60
      timeout_minutes:
        description: Deadline for all agent attempts.
        type: number
        default: 30
      max_attempts:
        description: Attempts for transient failures (edit runs retry in isolated copies).
        type: number
        default: 2
      setup_command:
        description: >-
          Optional command (for example dependency installation) run in the target
          checkout in a separate setup job without secrets. Only its resulting working
          tree reaches the agent job, as an archive agent-ci parses itself (files,
          directories and in-tree links only; never .git). It runs repository code: an edit-mode
          agent can later run that code with the model credential in its environment.
        type: string
        default: ''
      skills_oat_packs:
        description: Comma-separated OAT packs installed into the per-job home (for example core,docs).
        type: string
        default: ''
      skills_source:
        description: >-
          Skills directory in the target checkout to copy into the per-job home.
          Edit runs only: repository content never becomes a user skill in a read-only run.
        type: string
        default: ''
      publish_pr:
        description: Publish an edit run's changes as a static-branch pull request.
        type: boolean
        default: false
      publish_branch:
        description: >-
          Static branch name under agent-ci/. Empty means agent-ci/<use_case>.
          An existing branch is updated only while its head is agent-ci's own commit.
        type: string
        default: ''
      publish_base:
        description: >-
          Base branch of the published pull request. Empty means the pull request's head
          branch, else the triggering branch, else the default branch. Set it whenever
          target_ref points somewhere else, so the change set's base matches.
        type: string
        default: ''
      pr_title:
        description: Title of the published pull request.
        type: string
        default: ''
      comment_pr:
        description: Pull request number to comment on. Empty means the triggering pull request, if any.
        type: string
        default: ''
      publisher_login:
        description: >-
          Login the publish token acts as. Empty means github-actions[bot] (GITHUB_TOKEN);
          set it (for example my-app[bot]) when publishing with a GitHub App token.
        type: string
        default: ''
      artifact_name:
        description: Name of the run artifact (unique per workflow run).
        type: string
        default: agent-ci-run
      agent_ci_repository:
        description: >-
          Repository that provides the agent-ci helpers. Empty means this reusable
          workflow's own repository (job.workflow_repository).
        type: string
        default: ''
      agent_ci_ref:
        description: >-
          Helper ref (tag or SHA). Empty means this reusable workflow's own commit
          (job.workflow_sha), so the helpers always match the ref pinned in uses:.
        type: string
        default: ''
    secrets:
      AGENT_CI_SOURCE_TOKEN:
        description: Contents read on the agent-ci repository (consumer repositories; it is private).
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENCODE_API_KEY:
        required: false
      CURSOR_API_KEY:
        required: false
      AGENT_CI_NOTIFY_WEBHOOK:
        description: Optional https webhook (Slack-compatible) for a run notification.
        required: false
    outputs:
      status:
        description: changed, no-op or failed.
        value: ${{ jobs.publish.outputs.status }}
      pr_url:
        value: ${{ jobs.publish.outputs.pr_url }}
      comment_url:
        value: ${{ jobs.publish.outputs.comment_url }}

permissions:
  contents: read

jobs:
  # One immutable commit for every job, resolved by a trusted job (no
  # checkout, no repository code): a branch that moves mid-run cannot pair an
  # older prepared tree with a newer checkout.
  resolve:
    name: Resolve the target commit
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve the target ref to a commit
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.target_ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::cannot resolve $REF to a commit"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # The setup command runs repository code, so it gets its own job: no
  # process, $GITHUB_ENV/$GITHUB_PATH entry, toolcache change or git config it
  # creates can reach the job that holds the model credential. Only the
  # prepared working tree (without .git) is handed over.
  setup:
    name: Prepare workspace (no secrets)
    needs: resolve
    if: inputs.setup_command != ''
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    permissions:
      contents: read
    # Claims from untrusted code: the agent job re-checks the digest and
    # parses the archive itself (agent-ci workspace restore).
    outputs:
      prepared_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      prepared_sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out the target repository
        uses: actions/checkout@v5
        with:
          path: target
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the setup command
        working-directory: target
        env:
          SETUP_COMMAND: ${{ inputs.setup_command }}
        run: |
          corepack enable
          bash -c "$SETUP_COMMAND"

      # Best effort only: the setup command ran in this job and may have
      # changed anything here. The agent job is the trust boundary.
      - name: Pack the prepared working tree (without .git)
        id: pack
        run: |
          env -i PATH=/usr/bin:/bin tar --exclude=.git -czf "$RUNNER_TEMP/agent-ci-prepared.tgz" -C target .
          echo "sha256=$(sha256sum "$RUNNER_TEMP/agent-ci-prepared.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the prepared working tree
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-prepared
          path: ${{ runner.temp }}/agent-ci-prepared.tgz
          retention-days: 1
          if-no-files-found: error

  agent:
    name: Run agent
    needs: [resolve, setup]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.setup.result == 'skipped' || (needs.setup.result == 'success' && needs.setup.outputs.prepared_artifact_id != '')) }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    permissions:
      contents: read
    outputs:
      # Set only when the upload succeeded; the publish job takes exactly
      # this artifact and verifies this digest.
      result_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      result_digest: ${{ steps.digest.outputs.digest }}
      route_id: ${{ steps.route.outputs.route_id }}
    steps:
      # job.workflow_* name the reusable workflow's own repository and commit
      # (verified live 2026-10-25; github.workflow_sha is the caller's commit).
      - name: Require a resolvable helper ref
        if: (inputs.agent_ci_ref || job.workflow_sha) == '' || (inputs.agent_ci_repository || job.workflow_repository) == ''
        run: |
          echo "::error::Cannot resolve the agent-ci helper repository and commit; set agent_ci_repository and agent_ci_ref."
          exit 1

      - name: Check out the target repository
        uses: actions/checkout@v5
        with:
          path: target
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Check out the agent-ci helpers
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.agent_ci_repository || job.workflow_repository }}
          ref: ${{ inputs.agent_ci_ref || job.workflow_sha }}
          token: ${{ secrets.AGENT_CI_SOURCE_TOKEN || github.token }}
          path: .agent-ci-src
          persist-credentials: false

      - name: Set up agent-ci
        uses: ./.agent-ci-src/.github/actions/setup-agent-ci
        with:
          path: .agent-ci-src

      # The setup job's archive is hostile input: downloaded by the exact
      # artifact ID that job uploaded, then parsed by agent-ci itself (no tar
      # process) with an entry allowlist, into a staging directory that gets
      # this job's own .git. .git from the archive is refused at any depth.
      - name: Download the prepared working tree
        if: inputs.setup_command != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.setup.outputs.prepared_artifact_id }}
          path: ${{ runner.temp }}/agent-ci-prepared
          merge-multiple: true

      - name: Restore the prepared working tree
        if: inputs.setup_command != ''
        env:
          PREPARED_SHA256: ${{ needs.setup.outputs.prepared_sha256 }}
        run: agent-ci workspace restore --archive "$RUNNER_TEMP/agent-ci-prepared/agent-ci-prepared.tgz" --target target --sha256 "$PREPARED_SHA256"

      - name: Resolve the route
        id: route
        env:
          MODEL: ${{ inputs.model }}
          HARNESS: ${{ inputs.harness }}
          ROUTE: ${{ inputs.route }}
        run: agent-ci route --model "$MODEL" --harness "$HARNESS" --route "$ROUTE" --github-output

      - name: Install the harness
        env:
          HARNESS: ${{ steps.route.outputs.harness }}
        run: agent-ci harness install --harness "$HARNESS" --prefix "$RUNNER_TEMP/agent-ci-harness" --github-path

      # Ubuntu 24.04 blocks the user namespaces bubblewrap (Codex's Linux
      # sandbox) needs; lifting it is safe on a GitHub-hosted VM, which is
      # discarded after the job. Self-hosted runners are never reconfigured.
      - name: Enable the Codex sandbox (GitHub-hosted Linux)
        if: steps.route.outputs.harness == 'codex' && runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Check the Codex sandbox
        if: steps.route.outputs.harness == 'codex'
        run: agent-ci harness smoke --harness codex

      - name: Trust the target checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/target"

      - name: Install skills into the per-job home
        if: inputs.skills_oat_packs != ''
        env:
          PACKS: ${{ inputs.skills_oat_packs }}
        run: agent-ci skills install --home-root "$RUNNER_TEMP/agent-ci-home" --workspace target --oat-pack "$PACKS"

      # Repository skills are repository content: installed at user scope they
      # become trusted instructions, so only edit runs (whose agent can already
      # act on the repository) get them; read-only runs never do.
      - name: Install repository skills (edit runs only)
        if: inputs.skills_source != '' && inputs.mode == 'edit'
        env:
          SOURCE: ${{ inputs.skills_source }}
        run: agent-ci skills install --home-root "$RUNNER_TEMP/agent-ci-home" --workspace target --source "target/$SOURCE" --allow-workspace-source

      - name: Write the prompt
        env:
          PROMPT: ${{ inputs.prompt }}
        run: printf '%s' "$PROMPT" > "$RUNNER_TEMP/agent-ci-prompt.md"

      - name: Run the agent
        env:
          # Exactly one secret: the one the resolved route names (empty for the fake harness).
          AGENT_CI_CREDENTIAL: ${{ steps.route.outputs.credential != '' && secrets[steps.route.outputs.credential] || '' }}
          ROUTE_ID: ${{ steps.route.outputs.route_id }}
          MODE: ${{ inputs.mode }}
          CONTRACT: ${{ inputs.output_contract }}
          USE_CASE: ${{ inputs.use_case }}
          TIMEOUT: ${{ inputs.timeout_minutes }}
          ATTEMPTS: ${{ inputs.max_attempts }}
        run: >-
          agent-ci run --route "$ROUTE_ID" --credential-from-env
          --cwd target --out "$RUNNER_TEMP/agent-ci-out" --home-root "$RUNNER_TEMP/agent-ci-home"
          --prompt-file "$RUNNER_TEMP/agent-ci-prompt.md" --mode "$MODE" --contract "$CONTRACT"
          --use-case "$USE_CASE" --target-repo "$GITHUB_REPOSITORY"
          --timeout-minutes "$TIMEOUT" --max-attempts "$ATTEMPTS"

      - name: Check for a run result
        id: result
        if: always()
        run: test -f "$RUNNER_TEMP/agent-ci-out/run-result.json" && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"

      - name: Digest the run result
        id: digest
        if: always() && steps.result.outputs.present == 'true'
        run: agent-ci digest --dir "$RUNNER_TEMP/agent-ci-out" --github-output

      - name: Upload the run result
        id: upload
        if: always() && steps.digest.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/agent-ci-out
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish
    needs: [resolve, agent]
    if: ${{ !cancelled() && needs.agent.outputs.result_artifact_id != '' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      status: ${{ steps.publish.outputs.status }}
      pr_url: ${{ steps.publish.outputs.pr_url }}
      comment_url: ${{ steps.publish.outputs.comment_url }}
    steps:
      - name: Check out the target repository
        uses: actions/checkout@v5
        with:
          path: target
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Check out the agent-ci helpers
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.agent_ci_repository || job.workflow_repository }}
          ref: ${{ inputs.agent_ci_ref || job.workflow_sha }}
          token: ${{ secrets.AGENT_CI_SOURCE_TOKEN || github.token }}
          path: .agent-ci-src
          persist-credentials: false

      - name: Set up agent-ci
        uses: ./.agent-ci-src/.github/actions/setup-agent-ci
        with:
          path: .agent-ci-src

      # By the agent job's own upload ID, never by name: an artifact another
      # job of this run uploads under the same name is never used.
      - name: Download the run result
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.agent.outputs.result_artifact_id }}
          path: ${{ runner.temp }}/agent-ci-result
          merge-multiple: true

      - name: Publish
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_PR: ${{ inputs.publish_pr }}
          BRANCH: ${{ inputs.publish_branch }}
          BASE: ${{ inputs.publish_base || github.head_ref || (github.ref_type == 'branch' && github.ref_name) || github.event.repository.default_branch }}
          TITLE: ${{ inputs.pr_title }}
          COMMENT_PR: ${{ inputs.comment_pr || github.event.pull_request.number || '' }}
          PUBLISHER_LOGIN: ${{ inputs.publisher_login }}
          RESULT_DIGEST: ${{ needs.agent.outputs.result_digest }}
        run: >-
          agent-ci publish --result-dir "$RUNNER_TEMP/agent-ci-result" --cwd target
          --publish-pr "$PUBLISH_PR" --branch "$BRANCH" --base "$BASE" --title "$TITLE"
          --comment-on "$COMMENT_PR" --comment-author "$PUBLISHER_LOGIN"
          --result-digest "$RESULT_DIGEST" --github-output

      - name: Notify
        if: always() && steps.publish.outcome != 'skipped'
        env:
          AGENT_CI_NOTIFY_WEBHOOK: ${{ secrets.AGENT_CI_NOTIFY_WEBHOOK }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          RESULT_DIGEST: ${{ needs.agent.outputs.result_digest }}
        run: agent-ci notify --result-dir "$RUNNER_TEMP/agent-ci-result" --pr-url "$PR_URL" --result-digest "$RESULT_DIGEST"
