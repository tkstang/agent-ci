name: 'CI: Nested artifact identity probe'

on:
  workflow_call:
    inputs:
      scope:
        required: true
        type: string

permissions:
  contents: read

jobs:
  nested:
    name: Nested / ${{ inputs.scope }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/agent-ci-artifact-conformance-leaf.yml
    with:
      scope: ${{ inputs.scope }}
