# Execute a trusted PR comment against its existing head. Task text travels
# only in a digest-bound artifact. Repository code never gets a write token.
name: '[agent-ci] Run PR comment prompt'

on:
  workflow_call:
    inputs:
      comment_id:
        description: Real comment ID to replay on workflow_dispatch; author must be the dispatcher.
        type: string
        default: ''
      model:
        description: Required default model key when no profile is requested.
        type: string
        required: true
      model_profiles:
        description: Optional YAML mapping of cost, balance and intelligence to model, harness and route selections.
        type: string
        default: ''
      harness:
        type: string
        default: ''
      route:
        type: string
        default: ''
      allowed_models:
        description: Allowed model keys, separated by whitespace or commas.
        type: string
        required: true
      allowed_pr_authors:
        description: Bot PR authors allowed in addition to current repository writers.
        type: string
        default: ''
      setup_command:
        description: Optional dependency preparation in a separate job without model credentials.
        type: string
        default: ''
      check_command:
        description: Required final verification in a job without model or write credentials.
        type: string
        required: true
      skills_source:
        description: Skills directory in the exact PR head checkout, copied into the isolated home.
        type: string
        default: ''
      skills_oat_packs:
        type: string
        default: ''
      runs_on:
        type: string
        default: ubuntu-latest
      allow_pool:
        type: boolean
        default: false
      timeout_minutes:
        type: number
        default: 30
      job_timeout_minutes:
        type: number
        default: 60
      max_attempts:
        type: number
        default: 2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      ANTHROPIC_AUTH_TOKEN:
        required: false
      OPENCODE_API_KEY:
        required: false
      CURSOR_API_KEY:
        required: false
      AGENT_CI_PROXY_API_KEY:
        required: false
      AGENT_CI_PROXY_BASE_URL:
        required: false
      AGENT_CI_PUBLISH_TOKEN:
        description: Optional App token for pushes that trigger CI; publisher only.
        required: false
    outputs:
      status:
        value: ${{ jobs.publish.outputs.status }}
      commit:
        value: ${{ jobs.publish.outputs.commit }}
      pr_url:
        value: ${{ jobs.publish.outputs.pr_url }}
      head_sha:
        description: Actual PR head branch tip captured by the gate.
        value: ${{ jobs.gate.outputs.head_sha }}
      base_sha:
        description: Actual base branch tip captured by the gate.
        value: ${{ jobs.gate.outputs.base_sha }}

permissions:
  contents: read

concurrency:
  group: agent-ci-pr-command-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    name: Authorize the command and pin the PR
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      status: ${{ steps.gate.outputs.status }}
      request_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      request_digest: ${{ steps.gate.outputs.request_digest }}
      repository: ${{ steps.gate.outputs.repository }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      route_id: ${{ steps.gate.outputs.route_id }}
      credential: ${{ steps.gate.outputs.credential }}
      account: ${{ steps.gate.outputs.account }}
    steps:
      - name: Check out the agent-ci helpers
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .agent-ci-src
          persist-credentials: false
      - name: Set up agent-ci
        uses: ./.agent-ci-src/.github/actions/setup-agent-ci
        with:
          path: .agent-ci-src
      - name: Authorize the PR command
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.comment_id }}
          MODEL: ${{ inputs.model }}
          MODEL_PROFILES: ${{ inputs.model_profiles }}
          HARNESS: ${{ inputs.harness }}
          ROUTE: ${{ inputs.route }}
          ALLOW_POOL: ${{ inputs.allow_pool }}
          AGENT_CI_PROXY_BASE_URL: ${{ secrets.AGENT_CI_PROXY_BASE_URL }}
          ALLOWED_MODELS: ${{ inputs.allowed_models }}
          ALLOWED_PR_AUTHORS: ${{ inputs.allowed_pr_authors }}
        run: >-
          agent-ci pr-run gate --comment-id "$COMMENT_ID" --model "$MODEL"
          --model-profiles "$MODEL_PROFILES" --harness "$HARNESS" --route "$ROUTE"
          --allow-pool-value "$ALLOW_POOL" --allowed-models "$ALLOWED_MODELS"
          --allowed-pr-authors "$ALLOWED_PR_AUTHORS"
          --out "$RUNNER_TEMP/agent-ci-request" --github-output
      - name: Upload the request
        id: upload
        if: steps.gate.outputs.status == 'ready'
        uses: actions/upload-artifact@v7
        with:
          name: pr-command-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-ci-request
          if-no-files-found: error
          retention-days: 7

  setup:
    name: Prepare dependencies without model credentials
    needs: gate
    if: needs.gate.outputs.status == 'ready' && inputs.setup_command != ''
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    permissions:
      contents: read
    outputs:
      prepared_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      prepared_sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.gate.outputs.repository }}
          ref: ${{ needs.gate.outputs.head_sha }}
          path: target
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run the setup command
        working-directory: target
        env:
          SETUP_COMMAND: ${{ inputs.setup_command }}
        run: |
          corepack enable
          bash -c "$SETUP_COMMAND"
      - name: Pack the prepared working tree
        id: pack
        run: |
          env -i PATH=/usr/bin:/bin tar --exclude=.git -czf "$RUNNER_TEMP/agent-ci-prepared.tgz" -C target .
          echo "sha256=$(sha256sum "$RUNNER_TEMP/agent-ci-prepared.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload the prepared working tree
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: pr-command-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-ci-prepared.tgz
          if-no-files-found: error
          retention-days: 1

  agent:
    name: Execute the task
    needs: [gate, setup]
    if: ${{ !cancelled() && needs.gate.outputs.status == 'ready' && (needs.setup.result == 'skipped' || (needs.setup.result == 'success' && needs.setup.outputs.prepared_artifact_id != '')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/agent-job.yml
    with:
      runs_on: ${{ inputs.runs_on }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
      repository: ${{ needs.gate.outputs.repository }}
      cross: ${{ 'false' }}
      sha: ${{ needs.gate.outputs.head_sha }}
      base: ${{ needs.gate.outputs.head_ref }}
      route_id: ${{ needs.gate.outputs.route_id }}
      allow_pool: ${{ inputs.allow_pool }}
      mode: edit
      output_contract: changes
      use_case: pr-comment
      timeout_minutes: ${{ inputs.timeout_minutes }}
      max_attempts: ${{ inputs.max_attempts }}
      skills_source: ${{ inputs.skills_source }}
      skills_oat_packs: ${{ inputs.skills_oat_packs }}
      prepared_artifact_id: ${{ needs.setup.outputs.prepared_artifact_id }}
      prepared_sha256: ${{ needs.setup.outputs.prepared_sha256 }}
      pr_request_artifact_id: ${{ needs.gate.outputs.request_artifact_id }}
      pr_request_digest: ${{ needs.gate.outputs.request_digest }}
      artifact_name: pr-command-result-${{ github.run_id }}-${{ github.run_attempt }}
    secrets:
      AGENT_CI_CREDENTIAL: ${{ (needs.gate.outputs.credential == 'CLAUDE_CODE_OAUTH_TOKEN' && secrets.CLAUDE_CODE_OAUTH_TOKEN) || (needs.gate.outputs.credential == 'ANTHROPIC_API_KEY' && secrets.ANTHROPIC_API_KEY) || (needs.gate.outputs.credential == 'ANTHROPIC_AUTH_TOKEN' && secrets.ANTHROPIC_AUTH_TOKEN) || (needs.gate.outputs.credential == 'OPENCODE_API_KEY' && secrets.OPENCODE_API_KEY) || (needs.gate.outputs.credential == 'CURSOR_API_KEY' && secrets.CURSOR_API_KEY) || (needs.gate.outputs.credential == 'AGENT_CI_PROXY_API_KEY' && secrets.AGENT_CI_PROXY_API_KEY) || '' }}
      AGENT_CI_PROXY_BASE_URL: ${{ needs.gate.outputs.account == 'pool' && secrets.AGENT_CI_PROXY_BASE_URL || '' }}

  verify:
    name: Verify the resulting tree without credentials
    needs: [gate, agent]
    if: ${{ !cancelled() && needs.agent.outputs.result_artifact_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.gate.outputs.repository }}
          ref: ${{ needs.gate.outputs.head_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the agent-ci helpers
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .agent-ci-src
          persist-credentials: false
      - name: Set up agent-ci
        uses: ./.agent-ci-src/.github/actions/setup-agent-ci
        with:
          path: .agent-ci-src
      - name: Download the request
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.gate.outputs.request_artifact_id }}
          path: ${{ runner.temp }}/agent-ci-request
          merge-multiple: true
      - name: Download the result
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.agent.outputs.result_artifact_id }}
          path: ${{ runner.temp }}/agent-ci-result
          merge-multiple: true
      - name: Materialize the resulting tree
        env:
          REQUEST_DIGEST: ${{ needs.gate.outputs.request_digest }}
          RESULT_DIGEST: ${{ needs.agent.outputs.result_digest }}
        run: >-
          agent-ci pr-run materialize --request-dir "$RUNNER_TEMP/agent-ci-request"
          --request-digest "$REQUEST_DIGEST" --result-dir "$RUNNER_TEMP/agent-ci-result"
          --result-digest "$RESULT_DIGEST" --cwd target
      - name: Run final verification
        working-directory: target
        env:
          CHECK_COMMAND: ${{ inputs.check_command }}
        run: |
          test -n "$CHECK_COMMAND"
          corepack enable
          bash -c "$CHECK_COMMAND"

  publish:
    name: Commit and push to the existing PR
    needs: [gate, agent, verify]
    if: ${{ !cancelled() && needs.agent.outputs.result_artifact_id != '' }}
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      status: ${{ steps.publish.outputs.status }}
      commit: ${{ steps.publish.outputs.commit }}
      pr_url: ${{ steps.publish.outputs.pr_url }}
    steps:
      - name: Check out the PR head for publishing
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.gate.outputs.repository }}
          ref: ${{ needs.gate.outputs.head_sha }}
          token: ${{ secrets.AGENT_CI_PUBLISH_TOKEN || github.token }}
          path: target
          fetch-depth: 0
      - name: Check out the agent-ci helpers
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .agent-ci-src
          persist-credentials: false
      - name: Set up agent-ci
        uses: ./.agent-ci-src/.github/actions/setup-agent-ci
        with:
          path: .agent-ci-src
      - name: Download the request
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.gate.outputs.request_artifact_id }}
          path: ${{ runner.temp }}/agent-ci-request
          merge-multiple: true
      - name: Download the result
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.agent.outputs.result_artifact_id }}
          path: ${{ runner.temp }}/agent-ci-result
          merge-multiple: true
      - name: Publish the PR update
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_CI_PUBLISH_TOKEN || github.token }}
          REQUEST_DIGEST: ${{ needs.gate.outputs.request_digest }}
          RESULT_DIGEST: ${{ needs.agent.outputs.result_digest }}
          VERIFICATION: ${{ needs.verify.result }}
        run: >-
          agent-ci pr-run publish --request-dir "$RUNNER_TEMP/agent-ci-request"
          --request-digest "$REQUEST_DIGEST" --result-dir "$RUNNER_TEMP/agent-ci-result"
          --result-digest "$RESULT_DIGEST" --cwd target --verification "$VERIFICATION" --github-output
