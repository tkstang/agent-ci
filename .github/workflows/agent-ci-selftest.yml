# Credential-free self-test of run-agent.yml on pull requests in this
# repository: the fake harness makes an edit, the publish job opens or
# updates a static-branch pull request against the PR's head branch and
# comments on the PR. A second job installs all four harness CLIs, checks
# their versions and smoke-tests the Codex sandbox on the hosted runner.
#
# Runs only for same-repository pull requests labeled `agent-ci-selftest`
# (never for forks) or by manual dispatch.
name: 'CI: Agent self-test'

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      comment_id:
        description: Replay your real PR command through the PR-agent consumer test.
        default: ''
      command_model:
        description: Harness used only by the PR-comment consumer test.
        type: choice
        options: [fake-edit, grok-4.7]
        default: fake-edit

permissions:
  contents: read

concurrency:
  group: agent-ci-selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fake-run:
    name: Fake harness run and publish
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.comment_id == '') ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'agent-ci-selftest'))
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/run-agent.yml
    with:
      model: fake-edit
      prompt: 'agent-ci self-test: write the fake edit file.'
      mode: edit
      output_contract: changes
      use_case: selftest
      target_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      skills_oat_packs: core
      setup_command: echo prepared > agent-ci-prepared.txt
      publish_pr: true
      publish_branch: agent-ci/selftest-${{ github.event.pull_request.number || 'dispatch' }}
      publish_base: ${{ github.head_ref || github.ref_name }}
      artifact_name: agent-ci-selftest

  harness-smoke:
    name: Harness install and Codex sandbox smoke check
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.comment_id == '') ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'agent-ci-selftest'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out agent-ci
        uses: actions/checkout@v5
        with:
          path: .agent-ci-src
          persist-credentials: false

      - name: Set up agent-ci
        uses: ./.agent-ci-src/.github/actions/setup-agent-ci
        with:
          path: .agent-ci-src

      - name: Install all four harness CLIs (each checked with --version)
        run: agent-ci harness install --harness claude,codex,opencode,cursor --prefix "$RUNNER_TEMP/agent-ci-harness" --github-path

      - name: Report the installed versions from PATH
        run: |
          claude --version
          codex --version
          opencode --version
          agent --version

      - name: Smoke-test the Codex sandbox on this runner
        run: agent-ci harness smoke --harness codex --report-only

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which stops bubblewrap (Codex's Linux sandbox) from configuring its
      # network namespace. Probe whether lifting the restriction fixes it.
      - name: Allow unprivileged user namespaces (bubblewrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke-test the Codex sandbox again
        run: agent-ci harness smoke --harness codex --report-only

  pr-command:
    name: PR-comment reusable workflow consumer test
    if: github.event_name == 'workflow_dispatch' && inputs.comment_id != ''
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/pr-agent.yml
    with:
      comment_id: ${{ inputs.comment_id }}
      model: ${{ inputs.command_model || 'fake-edit' }}
      harness: ${{ inputs.command_model == 'grok-4.7' && 'cursor' || 'fake' }}
      allowed_models: fake-edit,grok-4.7
      model_profiles: |
        balance:
          model: ${{ inputs.command_model || 'fake-edit' }}
          harness: ${{ inputs.command_model == 'grok-4.7' && 'cursor' || 'fake' }}
      # Live skills are supplied only on the disposable test PR's head ref.
      skills_source: .github/agent-ci/test-skills
      check_command: >-
        if [ -f agent-ci-command-test.mjs ]; then node --test agent-ci-command-test.mjs;
        else test -f agent-ci-fake-edit.md; fi
      max_attempts: 1
      timeout_minutes: 10
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

  pr-command-assert:
    name: Assert the published consumer result
    needs: pr-command
    if: github.event_name == 'workflow_dispatch' && inputs.comment_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The assertion program must come from the workflow revision, never
      # the PR command's head or the agent's published commit.
      - name: Check out the assertion helpers
        if: inputs.command_model == 'grok-4.7'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: .agent-ci-src
          persist-credentials: false
      - name: Build the assertion helpers
        if: inputs.command_model == 'grok-4.7'
        uses: ./.agent-ci-src/.github/actions/setup-agent-ci
        with:
          path: .agent-ci-src
      - name: Check out the published result
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.pr-command.outputs.commit || needs.pr-command.outputs.head_sha }}
          fetch-depth: 0
          path: published-result
          persist-credentials: false
      - name: Assert published history
        working-directory: published-result
        env:
          FINAL_SHA: ${{ needs.pr-command.outputs.commit || needs.pr-command.outputs.head_sha }}
          ORIGINAL_HEAD_SHA: ${{ needs.pr-command.outputs.head_sha }}
          BASE_SHA: ${{ needs.pr-command.outputs.base_sha }}
          CHANGED: ${{ needs.pr-command.outputs.status == 'changed' }}
          EXPECT_BASE_MERGED: ${{ inputs.command_model == 'grok-4.7' }}
        run: |
          [[ "$FINAL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ORIGINAL_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$CHANGED" = true ]; then
            test "$(git rev-parse "$FINAL_SHA^1")" = "$ORIGINAL_HEAD_SHA"
          fi
          if [ "$EXPECT_BASE_MERGED" = true ]; then
            git merge-base --is-ancestor "$BASE_SHA" "$FINAL_SHA"
          fi
      - name: Assert published content
        if: inputs.command_model == 'grok-4.7'
        env:
          FINAL_SHA: ${{ needs.pr-command.outputs.commit || needs.pr-command.outputs.head_sha }}
        working-directory: published-result
        run: agent-ci selftest-content --sha "$FINAL_SHA"
