# Consumer template: the OAT docs update for this repository. Copy into
# .github/workflows/ of the repository to maintain. agent-ci owns the prompt
# (run oat-docs-analyze, then oat-docs-apply); do not copy it here. For the
# agent instructions update, call instructions-update.yml the same way.
#
# Secrets: the credential your model's route names (here
# CLAUDE_CODE_OAUTH_TOKEN). agent-ci is public; no source token is needed.
# The agent gets only that credential; publishing uses GITHUB_TOKEN in a
# separate job, so the resulting pull request's
# pull_request runs wait for approval by a user with write access, and its
# pushes start no runs.
name: '[agent-ci] Update documentation'

on:
  schedule:
    - cron: '23 10 * * 1' # adjust to your maintenance window
  workflow_dispatch:
    inputs:
      base:
        description: Branch to update and target with the pull request (empty = the dispatched branch; the default branch on schedule).
        type: string
        default: ''

# Reusable workflows can keep or reduce, never raise, these permissions; the
# nested publish job needs both.
permissions:
  contents: write
  pull-requests: write

jobs:
  docs-update:
    uses: tkstang/agent-ci/.github/workflows/docs-update.yml@v0.1.0
    with:
      model: claude-haiku-4-5
      base: ${{ inputs.base || '' }}
      # Trusted dependency setup from this repository's own scripts; it runs in a
      # separate job without secrets.
      setup_command: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
