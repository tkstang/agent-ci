# Consumer template: the OAT docs update for this repository. Copy into
# .github/workflows/ of the repository to maintain. agent-ci owns the prompt
# (run oat-docs-analyze, then oat-docs-apply); do not copy it here. For the
# agent instructions update, call instructions-update.yml the same way.
#
# Secrets: AGENT_CI_SOURCE_TOKEN (contents read on tkstang/agent-ci; it is
# private) and the credential your model's route names (here
# CLAUDE_CODE_OAUTH_TOKEN). The agent gets only that credential; publishing
# uses GITHUB_TOKEN in a separate job, so the resulting pull request does
# not trigger this repository's workflows.
name: OAT docs update (agent-ci)

on:
  schedule:
    - cron: '23 10 * * 1' # adjust to your maintenance window
  workflow_dispatch:
    inputs:
      base:
        description: Branch to update and target with the pull request (empty = default branch).
        type: string
        default: ''

# Reusable workflows can keep or reduce, never raise, these permissions; the
# nested publish job needs both.
permissions:
  contents: write
  pull-requests: write

jobs:
  docs-update:
    uses: tkstang/agent-ci/.github/workflows/docs-update.yml@main # pin a tag or SHA
    with:
      model: claude-haiku-4-5
      base: ${{ inputs.base || '' }}
      # Trusted dependency setup from this repository's own scripts; it runs in a
      # separate job without secrets.
      setup_command: ''
    secrets:
      AGENT_CI_SOURCE_TOKEN: ${{ secrets.AGENT_CI_SOURCE_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
