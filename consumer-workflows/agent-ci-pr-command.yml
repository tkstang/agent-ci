# Copy to the consumer repository's default branch and pin the reviewed SHA.
# Only current repository writers can request work on trusted same-repo PRs.
# Skills are loaded from the exact checked-out PR head. Use the selected
# harness's native invocation syntax; agent-ci does not parse skill names.
name: '[agent-ci] Run PR comment prompt'

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      comment_id:
        description: Replay your own unedited command comment by its numeric ID.
        required: true

permissions:
  contents: read

jobs:
  execute:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/agent-ci ') ||
        startsWith(github.event.comment.body, '@agent-ci ')))
    permissions:
      contents: write
      pull-requests: write
    uses: tkstang/agent-ci/.github/workflows/pr-agent.yml@e19032f689249f5cfbd80f258c03fac555fb38d1
    with:
      comment_id: ${{ inputs.comment_id || '' }}
      model: claude-haiku-5-5
      allowed_models: claude-haiku-5-5
      # Set the directory containing <skill-name>/SKILL.md in the PR checkout.
      # skills_source: .github/agent-ci/skills
      setup_command: pnpm install --frozen-lockfile
      check_command: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run lint && pnpm test
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Optional App token makes the pushed fix trigger normal CI:
      # AGENT_CI_PUBLISH_TOKEN: ${{ secrets.AGENT_CI_PUBLISH_TOKEN }}
