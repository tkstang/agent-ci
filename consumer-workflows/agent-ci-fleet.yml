# Public fleet template: copy into a public repository that owns your
# targets.yaml (see targets.example.yaml in agent-ci) to run the OAT
# maintenance presets across your PUBLIC repositories on GitHub-hosted runners.
#
# public_only: true makes every run refuse a target GitHub does not report as
# public (E_TARGET_VISIBILITY), before any job runs its code. For private
# targets use agent-ci-private-fleet.yml from a private fleet repository
# instead. This repository's Actions logs and artifacts are public too.
#
# How models run: see docs/running-models.md in agent-ci. This template uses
# a subscription token on GitHub-hosted runners. Do not attach a self-hosted
# runner to a public repository: a fork pull request can add a workflow that
# runs on it. To use your proxy pool here, reach it at its https endpoint
# instead (the commented pool lines below). Set AGENT_CI_TARGETS_JSON as a repository
# variable for a JSON target array appended after targets.yaml; leave it
# unset to use only the file. Variables are visible configuration.
#
# Secrets:
# - AGENT_CI_TARGET_TOKEN: contents and pull-requests write on every target
#   that is not this repository (a fine-grained token or GitHub App token
#   limited to those repositories). Only the resolve and publish jobs
#   reference it; no job that runs repository code or the agent does. Targets
#   in this repository use GITHUB_TOKEN instead.
# - The model credential of every route your targets use, one `secrets:` line
#   each. CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) serves the
#   claude-haiku-5-5 default through its personal route. targets validate
#   does not check credentials; a target whose credential is missing fails at
#   run time. tools-update needs none.
#
# Targets in this repository are published with GITHUB_TOKEN: their
# pull_request runs wait for approval and their pushes start no runs. Other
# targets are published with AGENT_CI_TARGET_TOKEN, whose events start
# workflows normally (for example a GitHub App token).
name: '[agent-ci] Run fleet'

on:
  # Manual runs only until a manual run of each preset has succeeded. Then
  # add schedules, for example:
  #   schedule:
  #     - cron: '17 9 * * 1' # docs-update, Mondays
  # and choose the preset from the schedule in `preset:` below:
  #   ${{ inputs.preset || (github.event.schedule == '17 9 * * 1' && 'docs-update') || 'tools-update' }}
  workflow_dispatch:
    inputs:
      preset:
        description: Use case to run.
        type: choice
        default: docs-update
        options: [docs-update, instructions-update, tools-update]
      target:
        description: all, or one target id or owner/name from targets.yaml.
        type: string
        default: all
      reset:
        description: Replace the selected target's static branch content (one target only).
        type: boolean
        default: false

# GitHub validates nested reusable-workflow job permissions against this
# caller, so it must grant the publish scopes even when every target is
# another repository (those are published with AGENT_CI_TARGET_TOKEN).
permissions:
  contents: write
  pull-requests: write

# One fleet run at a time.
concurrency:
  group: agent-ci-fleet
  cancel-in-progress: false

jobs:
  fan-out:
    uses: tkstang/agent-ci/.github/workflows/fan-out.yml@v0.2.0
    with:
      preset: ${{ inputs.preset }}
      target: ${{ inputs.target || 'all' }}
      reset: ${{ inputs.reset || false }}
      targets_file: targets.yaml
      targets_json: ${{ vars.AGENT_CI_TARGETS_JSON }}
      public_only: true
      # Your proxy pool at its https endpoint, on these GitHub-hosted runners:
      # uncomment allow_pool and the three pool secrets below. Each run's agent
      # step receives the pool key; give this fleet its own key, rate-limited
      # where your proxy supports it.
      # allow_pool: true
    secrets:
      AGENT_CI_TARGET_TOKEN: ${{ secrets.AGENT_CI_TARGET_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Add the credential of every other route your targets use, for example:
      # OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      # Pool routes (with allow_pool above): the pool key for Codex, the same
      # key for Claude Code, and the pool's https origin (https://host[:port]).
      # AGENT_CI_PROXY_API_KEY: ${{ secrets.AGENT_CI_PROXY_API_KEY }}
      # ANTHROPIC_AUTH_TOKEN: ${{ secrets.AGENT_CI_PROXY_API_KEY }}
      # AGENT_CI_PROXY_BASE_URL: ${{ secrets.AGENT_CI_PROXY_BASE_URL }}
