# Public fleet template: copy into the repository that owns your targets.yaml (see
# targets.example.yaml in agent-ci) to run the OAT maintenance presets across
# every target on a schedule or on demand.
#
# For private targets use agent-ci-private-fleet.yml and review its output and
# artifact limits. Private output suppression does not encrypt artifacts.
# Set AGENT_CI_TARGETS_JSON as a repository variable for a JSON target array
# appended after targets.yaml; leave it unset to use only the file. Variables
# are visible configuration.
#
# Secrets:
# - AGENT_CI_TARGET_TOKEN: contents and pull-requests write on every target
#   that is not this repository (a fine-grained token or GitHub App token).
#   Only the resolve and publish jobs reference it; no job that runs
#   repository code or the agent does. Targets in this repository use
#   GITHUB_TOKEN instead.
# - AGENT_CI_TARGET_READ_TOKEN: contents read on private targets, for the
#   checkouts in the jobs that run repository code or the agent. Public
#   targets need none. Grant it contents: read and nothing else (a
#   fine-grained or GitHub App token). Each run refuses it when it is the
#   write token, a classic token with any scope, or able to write repository
#   contents (dry-run check); other write permissions (pull requests,
#   Actions, secrets, administration) cannot be checked, so do not grant
#   them. One read token covers the whole fleet, so an agent
#   working on one target could read every private target the token can
#   read; give fleets with different trust their own fleet repository and
#   tokens (a secret cannot be chosen per target without a dynamic lookup).
# - The model credential of every route your targets use, one `secrets:` line
#   each (for example CLAUDE_CODE_OAUTH_TOKEN for claude-haiku-4-5 and
#   OPENCODE_API_KEY for grok-4.7). targets validate does not check this; a
#   target whose credential is missing fails at run time. tools-update needs
#   none.
# - Optional, pool routes only: AGENT_CI_PROXY_BASE_URL replaces the loopback
#   proxy origin with an https endpoint. A pool route also needs
#   allow_pool: true, a self-hosted runs_on and the route's pool key.
#   Claude Code uses ANTHROPIC_AUTH_TOKEN, which can map the existing
#   AGENT_CI_PROXY_API_KEY secret; Codex uses AGENT_CI_PROXY_API_KEY directly.
#
# Targets in this repository are published with GITHUB_TOKEN: their
# pull_request runs wait for approval and their pushes start no runs. Other
# targets are published with AGENT_CI_TARGET_TOKEN, whose events start
# workflows normally (for example a GitHub App token).
name: '[agent-ci] Run fleet'

on:
  schedule:
    - cron: '17 9 * * 1' # docs-update, Mondays
    - cron: '47 9 * * 3' # instructions-update, Wednesdays
    - cron: '37 9 * * 2' # tools-update, Tuesdays
  workflow_dispatch:
    inputs:
      preset:
        description: Use case to run.
        type: choice
        default: docs-update
        options: [docs-update, instructions-update, tools-update]
      target:
        description: all, or one target id or owner/name from targets.yaml.
        type: string
        default: all
      reset:
        description: Replace the selected target's static branch content (one target only).
        type: boolean
        default: false

# GitHub validates nested reusable-workflow job permissions against this
# caller, so it must grant the publish scopes even when every target is
# another repository (those are published with AGENT_CI_TARGET_TOKEN).
permissions:
  contents: write
  pull-requests: write

jobs:
  fan-out:
    uses: tkstang/agent-ci/.github/workflows/fan-out.yml@main # no release tag exists yet: replace main with a released version or reviewed agent-ci commit SHA
    with:
      preset: >-
        ${{ inputs.preset
        || (github.event.schedule == '17 9 * * 1' && 'docs-update')
        || (github.event.schedule == '47 9 * * 3' && 'instructions-update')
        || 'tools-update' }}
      target: ${{ inputs.target || 'all' }}
      reset: ${{ inputs.reset || false }}
      targets_file: targets.yaml
      targets_json: ${{ vars.AGENT_CI_TARGETS_JSON }}
    secrets:
      AGENT_CI_TARGET_TOKEN: ${{ secrets.AGENT_CI_TARGET_TOKEN }}
      AGENT_CI_TARGET_READ_TOKEN: ${{ secrets.AGENT_CI_TARGET_READ_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Add the credential of every other route your targets use, for example:
      # OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      # Optional, pool routes only (see docs/configuration.md): takes effect
      # only with allow_pool: true, a self-hosted runs_on and the pool key.
      # AGENT_CI_PROXY_API_KEY: ${{ secrets.AGENT_CI_PROXY_API_KEY }}
      # ANTHROPIC_AUTH_TOKEN: ${{ secrets.AGENT_CI_PROXY_API_KEY }}
      AGENT_CI_PROXY_BASE_URL: ${{ secrets.AGENT_CI_PROXY_BASE_URL }}
