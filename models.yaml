  - id: deepseek-v4.1-flash-opencode-login
    model: deepseek-v4.1-flash
    harness: opencode
    family: deepseek
    providerModel: opencode-go/deepseek-v4.1-flash
    login: true
    billing: subscription
    account: personal
    structuredOutput: prompt
    qualified: '2026-10-26'
    notes: OpenCode Console (Go) login seeded with --seed-login; local only.
  - id: deepseek-v4.1-flash-opencode
    model: deepseek-v4.1-flash
    harness: opencode
    family: deepseek
    providerModel: opencode-go/deepseek-v4.1-flash
    credentials: [OPENCODE_API_KEY]
    billing: subscription
    account: personal
    structuredOutput: prompt
    qualified: '2026-10-30'
